# OrderEcho agent (FIX initiator) configuration.
# Sessions mirror the emulator's config/orderecho_multi.yaml, seen from our side.
sessions:
  - { id: emu42,  fix_version: FIX.4.2, sender_comp_id: AGENT, target_comp_id: ORDERECHO, host: 127.0.0.1, port: 9878, heartbeat_sec: 30, reset_on_logon: true }
  - { id: emu44,  fix_version: FIX.4.4, sender_comp_id: AGENT, target_comp_id: ORDERECHO, host: 127.0.0.1, port: 9878, heartbeat_sec: 30, reset_on_logon: true }
  - { id: strict, fix_version: FIX.4.2, sender_comp_id: AGENT, target_comp_id: STRICTBRK, host: 127.0.0.1, port: 9879, heartbeat_sec: 30, reset_on_logon: true }

# Every session starts from these; any of them may be overridden per session.
defaults: { logon_timeout_sec: 10, logout_timeout_sec: 10, heartbeat_grace_pct: 20, reconnect: false, reconnect_interval_sec: 5,
            heartbeat_mismatch: warn,     # warn (keep our HeartBtInt) | refuse
            include_handl_inst: true,     # 21=1 on FIX 4.4 D/G (always sent on 4.2)
            clordid_prefix: OE,           # ClOrdIDs are <prefix>-<run_id>-<n>; add account: X for tag 1
            answer_grace_sec: 5 }         # live checks: requests younger than this are not yet "unanswered"

storage: { seqnum_dir: data/seqnums, msgstore_dir: data/msgstore, evidence_dir: data/evidence, certs_dir: data/certs }

logging: { log_dir: logs, fix_delimiter: "|", engine_level: INFO, console: true }

# A4: the agent service (orderecho serve) — loopback only.
service: { host: 127.0.0.1, port: 8190 }

# A4: the MCP front door (orderecho mcp / serve --mcp-http).
mcp: { allow_orders: true,            # send_order, cancel_order, replace_order, start_cert_run
       allow_emulator_tools: true,    # emulator_* tools (only with emulator.control_api below)
       http_token: "" }               # MCP over HTTP needs a bearer token; env ORDERECHO_MCP_TOKEN wins

# A4: these sessions' counterparty is the OrderEcho emulator; its control API
# backs the emulator_* tools (agent session id -> emulator session id).
emulator: { control_api: http://127.0.0.1:8090, sessions: { emu42: agent42, emu44: agent44, strict: strict-broker } }
