    area: Sign-Off
    title: "All required tests passed"
    task: "Confirm all Required tests have status = Pass before submitting for certification"
    required: true
    level: basic
    mode: manual
    steps:
      - manual: { prompt: "Review results.json: every required case is PASS (or N/A with the venue's agreement)." }

  - id: "9.2"
    section: SGN
    area: Sign-Off
    title: "Venue deviations documented"
    task: "Document any exchange-specific behavior deviations from FIX 4.2 spec"
    required: true
    level: basic
    mode: manual
    steps:
      - manual: { prompt: "Document the venue's deviations from FIX 4.2 seen during certification (warnings and N/A reasons are a starting point)." }

